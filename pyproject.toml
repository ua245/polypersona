[project]
name = "polypersona"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "modal>=1.5.5",
    "playwright>=1.63.0",
    "pydantic-ai-slim[google]>=2.46.0",
    "python-dotenv>=1.2.3",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
filterwarnings = ["ignore::pytest.PytestCollectionWarning"]
