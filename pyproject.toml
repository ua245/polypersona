[project]
name = "polypersona"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "certifi>=2026.7.22",
    "fastapi>=0.141.1",
    "modal>=1.5.5",
    "pydantic>=2.13.5",
    "pydantic-ai-slim[google]>=2.46.0",
    "python-dotenv>=1.2.3",
    "python-multipart>=0.0.32",
    "uvicorn[standard]>=0.53.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
