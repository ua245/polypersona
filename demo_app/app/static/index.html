<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Ticket Shop</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 640px; margin: 2rem auto; padding: 0 1rem; }
  button { margin-right: .5rem; padding: .5rem 1rem; }
  #orders li { font-family: monospace; }
</style>
</head>
<body>
<h1>Ticket Shop</h1>
<p>Signed in as fixture customer <strong id="customer">alice</strong> (demo only, no real auth).</p>
<label>Ticket <select id="ticket"></select></label>
<label>Qty <input id="qty" type="number" value="1" min="1" max="10"></label>
<p>
  <button id="buy">Buy</button>
  <button id="retry" disabled>Retry last request</button>
</p>
<p id="status" role="status"></p>
<h2>My orders (<span id="order-count">0</span>)</h2>
<ul id="orders"></ul>
<script>
const customer = "alice";
let lastBody = null;

async function loadTickets() {
  const res = await fetch("/api/tickets");
  const sel = document.getElementById("ticket");
  for (const t of await res.json()) {
    const o = document.createElement("option");
    o.value = t.id; o.textContent = `${t.name} ($${(t.price_cents / 100).toFixed(2)})`;
    sel.appendChild(o);
  }
}

async function loadOrders() {
  const res = await fetch("/api/orders", { headers: { "X-Customer-Id": customer } });
  const orders = await res.json();
  document.getElementById("order-count").textContent = orders.length;
  document.getElementById("orders").innerHTML =
    orders.map(o => `<li data-order-id="${o.id}">#${o.id} ${o.ticket_id} x${o.quantity}</li>`).join("");
}

async function send(body) {
  const res = await fetch("/api/purchases", {
    method: "POST",
    headers: { "Content-Type": "application/json", "Idempotency-Key": body.idempotency_key },
    body: JSON.stringify(body),
  });
  const data = await res.json();
  document.getElementById("status").textContent =
    res.ok ? `Order #${data.id} confirmed (HTTP ${res.status})` : `Error HTTP ${res.status}: ${JSON.stringify(data)}`;
  await loadOrders();
}

document.getElementById("buy").onclick = async () => {
  lastBody = {
    customer_id: customer,
    ticket_id: document.getElementById("ticket").value,
    quantity: Number(document.getElementById("qty").value),
    idempotency_key: crypto.randomUUID(),
  };
  document.getElementById("retry").disabled = false;
  await send(lastBody);
};

// Simulates a client retry after a timeout: resends the exact same request.
document.getElementById("retry").onclick = () => send(lastBody);

loadTickets().then(loadOrders);
</script>
</body>
</html>
